name: CI Autotests Run
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-autotests:
    name: Run Tests and Deploy Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew clean test -Dselenide.headless=true
        continue-on-error: true

      - name: Generate Allure Report
        run: |
          docker run --rm \
            -v "$(pwd)/build/allure-results:/allure-results" \
            -v "$(pwd)/allure-report:/allure-report" \
            allure-framework/allure:latest \
            generate /allure-results -o /allure-report --clean


      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

